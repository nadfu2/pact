<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F3A2E">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="The Pact">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>The Pact</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <!-- Hidden form so Netlify Forms can receive bug / feature reports sent from the app -->
  <form name="pact-report" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="pact-report">
    <input name="bot-field"><input name="ticket"><input name="type"><input name="area"><input name="email"><input name="page"><input name="when"><input name="userAgent">
    <textarea name="details"></textarea>
  </form>
  <div id="root"></div>
  <script src="config.js"></script>
  <script src="assets/app.js"></script>
  <script>if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); }); }</script>
</body>
</html>
