<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F3EC">
  <title>Pact</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231F3A2E'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <!-- Hidden form so Netlify Forms can receive bug / feature reports sent from the app -->
  <form name="pact-report" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="pact-report">
    <input name="bot-field"><input name="ticket"><input name="type"><input name="area"><input name="email"><input name="page"><input name="when"><input name="userAgent">
    <textarea name="details"></textarea>
  </form>
  <div id="root"></div>
  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
